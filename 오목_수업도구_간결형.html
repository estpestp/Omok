<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI의 한 수를 읽어라! 오목 수업 도구</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#162b38;font:17px system-ui,'Malgun Gothic',sans-serif}main{max-width:1200px;margin:auto;padding:22px}h1{margin:0 0 8px;font-size:30px}p{line-height:1.5}.layout{display:grid;grid-template-columns:minmax(310px,650px) 1fr;gap:24px;margin-top:18px}canvas{width:100%;background:#efe2bd;border-radius:8px;touch-action:manipulation}button,select{font:inherit;padding:10px 12px;border:1px solid #bac7cc;border-radius:6px;background:white;color:#163745;margin:3px;cursor:pointer}button.primary{background:#126c78;color:white}button:disabled{opacity:.45;cursor:default}#status{font-size:22px;font-weight:bold;margin:10px 0}#log{background:white;padding:12px;max-height:165px;overflow:auto;line-height:1.8;white-space:pre-wrap}small{color:#52606a;line-height:1.5}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{background:white;border:1px solid #d2dedf;border-radius:8px;padding:14px}.score strong{display:block;font-size:32px;color:#126c78;margin-top:8px}.score span{font-size:14px}#scorebody[hidden]{display:none}dialog{border:0;border-radius:14px;max-width:440px;padding:30px;color:#162b38;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#162b3866}#resultbar{padding:12px;background:#e0efeb;border-radius:8px;margin-bottom:10px}progress{width:100%;height:12px;accent-color:#126c78}@media(max-width:800px){.layout{grid-template-columns:1fr}main{padding:12px}h1{font-size:25px}}</style>
<main><h1>AI의 한 수를 읽어라!</h1><small>-오목과 스무고개로 키우는 질문·예측·전략 설계력</small><p>9×9 연습판 · 5개 이상 먼저 연결하면 승리 · 금수 없음</p>
<div class="bar" style="margin:18px 0 10px" role="group" aria-label="진행 방식"><button id="playblack">AI 대결 · 나는 흑</button><button id="playwhite">AI 대결 · 나는 백</button><button id="playmanual">함께 탐구 · 두 색 직접 놓기</button></div>
<input type="hidden" id="mode" value="ai"><input type="hidden" id="human" value="1">
<div class="bar"><button id="reset">새 대국</button><button id="puzzle">공통 장면</button><button id="advanced">심화 장면</button><button id="undo">한 수 되돌리기</button><button id="save">장면 저장</button></div>
<div class="layout"><div><canvas id="board" width="700" height="700" aria-label="오목판 A부터 I열, 1부터 9행"></canvas><div class="bar"><label>좌표 <select id="col" aria-label="열"></select><select id="row" aria-label="행"></select></label><button id="place">놓기</button></div><small>주황색 점: 마지막 수</small></div><aside><div id="status" role="status" aria-live="polite"></div><div id="resultbar" hidden><strong id="resulttext"></strong><button id="againbar">다시하기</button></div><button class="primary" id="aimove">AI 응수 보기</button>
<button id="toggle" aria-expanded="false">점수 보기</button><div id="scorebody" hidden><div class="scores"><div class="score">내 최근 한 수<strong id="lastscore">—</strong><span>선택 점수 / 100</span><progress id="lastmeter" max="100" value="0"></progress></div><div class="score">이번 판 종합<strong id="totalscore">—</strong><span id="count">내 수들의 평균 / 100</span><progress id="totalmeter" max="100" value="0"></progress></div></div><p id="feedback"></p><small>학습용 비교 점수 · 종합은 내 수의 평균이며 승률이 아닙니다.</small></div>


<h3>착수 기록</h3><div id="log"></div></aside></div></main>
<dialog id="result"><h2 id="resulttitle"></h2><p id="resultmessage"></p><button class="primary" id="again">다시하기</button><button id="review">마지막 판 살펴보기</button></dialog>
<script>
const N=9,dirs=[[1,0],[0,1],[1,1],[1,-1]];let b=Array(81).fill(0),moves=[],turn=1,ended=false,showScores=false,aiCandidates=[];
const el=id=>document.getElementById(id),cv=el('board'),ctx=cv.getContext('2d'),coord=i=>String.fromCharCode(65+i%9)+(Math.floor(i/9)+1),human=()=>Number(el('human').value),manual=()=>el('mode').value==='manual';
function inside(x,y){return x>=0&&x<9&&y>=0&&y<9}
function winAt(a,i,p){let x=i%9,y=Math.floor(i/9);return dirs.some(([dx,dy])=>{let n=1;for(let sg of [-1,1]){let k=1;while(inside(x+sg*k*dx,y+sg*k*dy)&&a[(y+sg*k*dy)*9+x+sg*k*dx]===p){n++;k++}}return n>=5})}
function empties(a){return a.map((v,i)=>v===0?i:-1).filter(i=>i>=0)}
function near(a){if(a.every(v=>!v))return [40];return empties(a).filter(i=>{let x=i%9,y=Math.floor(i/9);for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(inside(x+dx,y+dy)&&a[(y+dy)*9+x+dx])return true;return false})}
function value(a,p){let z=0;for(let y=0;y<9;y++)for(let x=0;x<9;x++)if(a[y*9+x]===p)for(let [dx,dy]of dirs){if(inside(x-dx,y-dy)&&a[(y-dy)*9+x-dx]===p)continue;let n=0;while(inside(x+n*dx,y+n*dy)&&a[(y+n*dy)*9+x+n*dx]===p)n++;let op=0;if(inside(x-dx,y-dy)&&!a[(y-dy)*9+x-dx])op++;if(inside(x+n*dx,y+n*dy)&&!a[(y+n*dy)*9+x+n*dx])op++;z+=n>=5?1000000:op===0?0:n===4?(op===2?60000:8000):n===3?(op===2?2000:180):n===2?(op===2?70:12):op*2;}return z}
function immediate(a,p){return empties(a).filter(i=>{a[i]=p;let w=winAt(a,i,p);a[i]=0;return w})}

function evaluateMove(a,p,i){a[i]=p;if(winAt(a,i,p)){a[i]=0;return 1000000}let worst=Infinity;for(let r of near(a)){a[r]=3-p;let v=winAt(a,r,3-p)?-1000000:value(a,p)-1.1*value(a,3-p);worst=Math.min(worst,v);a[r]=0}if(worst===Infinity)worst=0;a[i]=0;return worst}
function analyse(a,p,extra){const wins=immediate(a,p),blocks=immediate(a,3-p);let shortlist=near(a).map(i=>{a[i]=p;let score=value(a,p)-1.1*value(a,3-p);a[i]=0;return {i,score}}).sort((u,v)=>v.score-u.score||u.i-v.i).slice(0,10).map(x=>x.i);let ids=[...new Set([...shortlist,...wins,...blocks,...(extra===undefined?[]:[extra])])];let scored=ids.map(i=>({i,raw:evaluateMove(a,p,i)})).sort((u,v)=>v.raw-u.raw||u.i-v.i);let best=scored[0]?.raw??0;for(let r of scored)r.points=best<=-1000000?0:Math.max(0,Math.min(100,Math.round(100-100*(best-r.raw)/(Math.abs(best)+1000))));return {i:scored[0]?.i,scored,reason:wins.length?'win':blocks.length?'block':'search'};}
function choose(a,p){return analyse(a,p)}
function closeResult(){if(el('result').open)el('result').close()}
function updateScores(){const own=moves.filter(m=>m.points!==null&&m.points!==undefined),last=own.at(-1);const avg=own.length?Math.round(own.reduce((s,m)=>s+m.points,0)/own.length):null;el('scorebody').hidden=!showScores;el('toggle').textContent=showScores?'점수 숨기기':'점수 보기';el('toggle').setAttribute('aria-expanded',String(showScores));el('lastscore').textContent=last?`${last.points}점`:'—';el('totalscore').textContent=avg===null?'—':`${avg}점`;el('lastmeter').value=last?.points??0;el('totalmeter').value=avg??0;el('count').textContent=`내 ${own.length}수의 평균 / 100`;el('feedback').textContent=manual()?'탐구 모드에서는 점수를 매기지 않습니다.':last?`${coord(last.i)}: ${last.points>=90?'비교한 후보 중 좋은 선택에 가깝습니다.':last.points>=60?'다른 후보와 상대의 응수를 다시 비교해 보세요.':'상대의 공격이나 더 좋은 후보를 놓쳤는지 살펴보세요.'}`:'내 첫 수를 놓으면 점수가 표시됩니다.';}
function apply(i,actor='manual',points=null){if(ended||!Number.isInteger(i)||i<0||i>=81||b[i])return false;b[i]=turn;moves.push({i,p:turn,actor,points});ended=winAt(b,i,turn)||moves.length===81;turn=3-turn;draw();if(ended){let last=moves.at(-1),won=winAt(b,last.i,last.p),title=won?(manual()?(last.p===1?'검은 돌 승리!':'흰 돌 승리!'):last.p===human()?'내가 이겼어요!':'AI가 이겼어요!'):'무승부입니다';el('resulttitle').textContent=title;el('resultmessage').textContent=won?'5개 이상 연결되어 경기가 끝났습니다. 마지막 장면을 살펴보거나 새 판을 시작하세요.':'빈자리가 없어 경기가 끝났습니다.';el('resulttext').textContent=title;if(!el('result').open)el('result').showModal()}return true}
function humanMove(i){if(ended||b[i]||!Number.isInteger(i)||i<0||i>=81)return;if(!manual()&&turn!==human())return;if(manual())apply(i);else {let r=analyse(b,turn,i);apply(i,'human',r.scored.find(v=>v.i===i).points)}}
function draw(){ctx.clearRect(0,0,700,700);ctx.fillStyle='#efe2bd';ctx.fillRect(0,0,700,700);ctx.strokeStyle='#99855d';ctx.lineWidth=1.2;ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';for(let j=0;j<9;j++){let v=70+j*70;ctx.beginPath();ctx.moveTo(70,v);ctx.lineTo(630,v);ctx.moveTo(v,70);ctx.lineTo(v,630);ctx.stroke();ctx.fillStyle='#243444';ctx.fillText(String.fromCharCode(65+j),v,30);ctx.fillText(j+1,30,v)}for(let i=0;i<81;i++)if(b[i]){let x=70+(i%9)*70,y=70+Math.floor(i/9)*70;ctx.beginPath();ctx.arc(x,y,27,0,Math.PI*2);ctx.fillStyle=b[i]===1?'#172735':'white';ctx.fill();ctx.strokeStyle='#172735';ctx.lineWidth=2;ctx.stroke();}if(moves.length){let i=moves.at(-1).i;ctx.beginPath();ctx.arc(70+i%9*70,70+Math.floor(i/9)*70,7,0,Math.PI*2);ctx.fillStyle='#e06e38';ctx.fill()}

let last=moves.at(-1);el('status').textContent=ended?(last&&winAt(b,last.i,last.p)?(last.p===1?'검은 돌':'흰 돌')+' 승리 · 경기 종료':'무승부 · 경기 종료'):(turn===1?'검은 돌':'흰 돌')+' 차례'+(manual()?'':turn===human()?' · 내 차례':' · AI 차례');el('aimove').disabled=ended||manual()||turn===human();el('aimove').textContent=moves.length===0&&human()===2?'AI 첫 수 보기':'AI 응수 보기';el('place').disabled=ended||(!manual()&&turn!==human());el('human').disabled=false;for(const [id,active] of [['playblack',!manual()&&human()===1],['playwhite',!manual()&&human()===2],['playmanual',manual()]]){el(id).setAttribute('aria-pressed',String(active));el(id).className=active?'primary':'';}el('undo').disabled=!moves.length;el('resultbar').hidden=!ended;el('log').textContent=moves.map((m,k)=>`${k+1}. ${m.p===1?'흑':'백'} ${coord(m.i)}`).join('\n')||'아직 놓인 돌이 없어요.';updateScores();}
function reset(){closeResult();b=Array(81).fill(0);moves=[];turn=1;ended=false;aiCandidates=[];draw()}
el('aimove').onclick=()=>{if(el('aimove').disabled)return;let r=choose(b,turn);if(r.i===undefined)return;aiCandidates=r.scored.slice(0,3);apply(r.i,'ai')};
cv.onclick=e=>{let r=cv.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)*700/r.width-70)/70),y=Math.round(((e.clientY-r.top)*700/r.height-70)/70);if(inside(x,y))humanMove(y*9+x)};
el('place').onclick=()=>{if(!el('place').disabled)humanMove(Number(el('row').value)*9+Number(el('col').value))};for(let j=0;j<9;j++){el('col').add(new Option(String.fromCharCode(65+j),j));el('row').add(new Option(j+1,j))}
function continuePosition(){for(const m of moves)m.points=null;aiCandidates=[];draw()}
el('reset').onclick=reset;el('mode').onchange=continuePosition;el('human').onchange=()=>{el('mode').value='ai';continuePosition()};el('toggle').onclick=()=>{showScores=!showScores;updateScores()};el('undo').onclick=()=>{if(!moves.length)return;closeResult();let m=moves.pop();b[m.i]=0;turn=m.p;ended=false;aiCandidates=[];draw()};
function loadPuzzle(deep=false){reset();let seq=['E5','F5','F4','E4','F6','E6','G5','G4'];if(deep)seq.push('H3','G6');for(let a of seq)apply((+a.slice(1)-1)*9+a.charCodeAt(0)-65)}
function selectPlay(mode,side){const changed=el('mode').value!==mode||(side!==undefined&&human()!==side);el('mode').value=mode;if(side!==undefined)el('human').value=String(side);if(changed)continuePosition();else draw()}
el('playblack').onclick=()=>selectPlay('ai',1);el('playwhite').onclick=()=>selectPlay('ai',2);el('playmanual').onclick=()=>selectPlay('manual');
el('puzzle').onclick=()=>loadPuzzle();el('advanced').onclick=()=>loadPuzzle(true);el('again').onclick=reset;el('againbar').onclick=reset;el('review').onclick=closeResult;
el('save').onclick=()=>{let a=document.createElement('a');a.download='오목장면_'+moves.length+'수.png';a.href=cv.toDataURL('image/png');a.click()};reset();
</script></html>
